# -----------------------------------------------------------------------------
# Multi-service stack: Nginx reverse proxy → .NET API → SQL Server
#
#   cp .env.example .env      # set MSSQL_SA_PASSWORD
#   docker compose up -d
#   curl http://localhost/healthz        # Nginx
#   curl http://localhost/               # proxied to the API
#
# Networks:
#   frontend: Nginx and API (the only path in from the host)
#   backend:  API and DB (internal: no host access, no internet egress)
# -----------------------------------------------------------------------------
name: api-stack

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: api-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Swap in your own image, e.g. ghcr.io/<org>/<api>:<git-sha>.
    # The default is Microsoft's public ASP.NET sample, so the stack runs as-is.
    image: ${API_IMAGE:-mcr.microsoft.com/dotnet/samples:aspnetapp}
    container_name: api-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: >-
        Server=db,1433;Database=${DB_NAME:-AppDb};User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};
        TrustServerCertificate=True
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: api-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *default-logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  mssql-data:
